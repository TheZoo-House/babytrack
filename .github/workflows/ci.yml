name: CI
on:
  push:
    branches: ['main', 'feat/**', 'fix/**', 'chore/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    name: Backend and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: scripts/check --server
      - name: Docker storage smoke
        run: |
          docker build -t babytrack-ci .
          docker run -d --name babytrack-ci -p 127.0.0.1:18793:8792 -e PREVIEW_ENABLED=1 babytrack-ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18793/health; then break; fi
            sleep 1
          done
          curl --fail --silent -X POST http://127.0.0.1:18793/v1/auth/preview -o /tmp/babytrack-preview.json
          node -e 'const p=JSON.parse(require("node:fs").readFileSync("/tmp/babytrack-preview.json")); require("node:assert/strict").ok(p.user.preview && p.snapshot.entities.length > 0)'
          docker rm -f babytrack-ci
  app:
    name: Apple build and core tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: brew install xcodegen
      - run: scripts/check --core
      - run: xcodegen generate --spec app/project.yml
      - run: scripts/setup-ios-test-pool
        env:
          IOS_SIMULATOR_POOL_SIZE: '1'
      - name: Native journeys and paired dropdown benchmarks
        run: |
          dropdown_tests=(
            BabytrackUITests/BabytrackUITests/testLargeHistoryDropdownPerformance
            BabytrackUITests/BabytrackUITests/testSmallHistoryDropdownPerformance
          )
          scripts/test-ios "${dropdown_tests[@]/#/-skip-testing:}" -resultBundlePath .codex-tmp/ci-ios.xcresult
          for calibration in 1 2; do
            result_bundle=".codex-tmp/ci-dropdown-${calibration}.xcresult"
            scripts/test-ios "${dropdown_tests[@]/#/-only-testing:}" -resultBundlePath "$result_bundle"
            gate_status=0
            scripts/check-ios-dropdown-performance "$result_bundle" --relative || gate_status=$?
            if [[ "$gate_status" == 0 ]]; then break; fi
            if [[ "$gate_status" != 2 || "$calibration" == 2 ]]; then exit "$gate_status"; fi
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-test-results
          path: |
            .codex-tmp/ci-ios.xcresult
            .codex-tmp/ci-dropdown-*.xcresult
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [server, app]
    steps:
      - run: test '${{ needs.server.result }}' = success && test '${{ needs.app.result }}' = success
